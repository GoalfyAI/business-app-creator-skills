interface:
  display_name: "智能应用开发"
  brand_color: "#6366F1"
  short_description: "确认一次需求后用预置件与生成器做出 GoalfyMax 智能应用，并验证上线"
  default_prompt: "使用 $business-app-creator 帮我把这项业务做成智能应用：先给我一页确认页，确认后直接做，做完给我在线预览。"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: business-app-creator-mcp
      transport: streamable_http
      url: https://business-app-creator-mcp.goalfyai.cn/mcp
      bearer_token_env_var: BUSINESS_APP_CREATOR_API_KEY
