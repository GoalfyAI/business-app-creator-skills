<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--TITLE--></title>
<style>
/* 样式基准：《四份开发文档样式规范清单》v2（B 版「文档」风格，陈羽杰 2026-11-06）。颜色只用清单第 3 节的 22 色，改动先与陈羽杰确认。
   结构层（下面到「v2 B 版组件层」之前）管布局和显隐；组件层接在后面，管外观 */
:root{--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
--ink:#1f1d1a;--ink-2:#3a3631;--muted:#7a7268;--faint:#a89f93;--page:#fdfcfa;--surface:#ffffff;--surface-2:#f7f4ef;--surface-3:#efeae2;--border:#e9e3da;--th-bg:transparent;
--accent:#3b4ba8;--accent-ink:#ffffff;--accent-soft:#eef0fa;--accent-text:#3b4ba8;--accent-ring:rgba(59,75,168,.14);--link:#3b4ba8;
--ok:#3f7a4f;--ok-soft:#eef5ef;--ok-line:#c6dccb;--warn:#a3651b;--warn-soft:#fbf3e6;--bad:#b0413e;--bad-soft:#faeceb;--user:#3f7a4f;--ai:#3b4ba8;--edge:#d8d0c4;
--num-bg:transparent;--num-text:#a89f93;--pin-bg:#3b4ba8;--pin-text:#ffffff;--seg-bg:#f2eee8;--phase-bg:transparent;--phase-border:#e2dacd;
--radius:6px;--radius-sm:5px;--radius-lg:8px;--card-border:1px solid #e9e3da;--raise:0 1px 2px rgba(60,45,20,.06);--card-shadow:none;--demo-shadow:0 12px 32px -18px rgba(60,45,20,.25);--shadow:none;--shadow-path:none;
--h1:34px;--h1-font:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;--h1-weight:700;--h1-track:0;--h2:20px;--h2-font:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;--gap:56px;--doc-w:860px;
--line:#e9e3da;--bg:#ffffff;--bg-subtle:#f7f4ef;--bg-tab:#f2eee8;--green:#3f7a4f;--green-pale:#eef5ef;--purple:#3b4ba8;--orange:#a3651b;--red:#b0413e;--primary:#3b4ba8;--pass-line:#c6dccb;--pass-text:#3f7a4f;--fail:#e3aaa8;--blocked:#a3651b;--unknown:#d8d0c4;--pending:#a3651b;--pending-bg:#fbf3e6;--pin:#3b4ba8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.65 var(--font)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 11px}
button:hover{background:var(--bg-subtle)}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
a{color:var(--purple);text-decoration:none}
small,.muted{color:var(--muted)}
.doc{max-width:1100px;margin:0 auto;padding:24px 20px 72px}
.eyebrow{font-size:9px;font-weight:600;line-height:1.65;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.doc-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.doc-head h1{font-size:23px;font-weight:650;line-height:1.65;color:var(--ink)}
.doc-head .lead{font-size:13px;line-height:1.9;color:var(--muted);margin-bottom:18px}
.meta{font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;line-height:1.65;padding:3px 8px;border-radius:5px;background:var(--green-pale);color:var(--green);white-space:nowrap}
.tag.warn{background:var(--pending-bg);color:var(--pending);padding:3px 7px;border-radius:4px}
.tag.fail{background:var(--bg);color:var(--red);border:1px solid var(--fail)}
.tag.unknown{background:var(--bg-subtle);color:var(--muted)}
.tag.accent{background:var(--bg-subtle);color:var(--purple)}
.changes{margin:12px 0 0;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg-subtle);font-size:13px}
.changes summary{cursor:pointer;color:var(--muted)}
.changes ul{margin:8px 0 0;padding-left:18px}
.section{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h2{font-size:15px;font-weight:600;line-height:1.65;color:var(--ink)}
.num{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:8px;font-weight:400}
.intro{font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:18px}
.pending-card{margin-top:14px;background:var(--pending-bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
details.fold{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
details.fold+details.fold{margin-top:8px}
details.fold>summary{cursor:pointer;padding:12px 14px;font-size:12px;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"展开";font-weight:400;font-size:11px;color:var(--faint)}
details.fold[open]>summary:after{content:"收起"}
details.fold>.fold-body{padding:0 14px 14px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{font-size:11px;font-weight:500;color:var(--muted);background:var(--bg-subtle);padding:6px 12px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.table-wrap table{min-width:560px}
ul.plain{margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--faint)}
.by-user .dot,.dot.user{background:var(--green)}
.by-ai .dot,.dot.ai{background:var(--purple)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--pass-text)}
.sdot.fail{background:var(--fail)}.sdot.blocked{background:var(--blocked)}.sdot.unknown{background:var(--unknown)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
/* 需求说明 */
.overview{display:grid;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.overview .row{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 14px;background:var(--bg-subtle)}
.overview .row+.row{border-top:1px solid var(--line)}
.overview .row small{font-size:11px;padding-top:2px}
.phase-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.phase-tabs button{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--bg-tab);border-color:var(--bg-tab);border-radius:6px;padding:5px 10px}
.phase-tabs button[aria-pressed=true]{background:var(--bg);border-color:var(--line);color:var(--ink)}
.graph{position:relative;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:24px;padding:8px 4px 34px 14px}
.graph svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.edges path{fill:none;stroke:var(--unknown);stroke-width:1.3}
.edges path.loop{stroke:var(--purple);stroke-dasharray:5 5;opacity:.7}
.edges path.on{stroke:var(--purple);stroke-width:2}
.edges text{font-size:10px;fill:var(--purple)}
.phase{background:var(--bg-subtle);border:1px solid var(--line);border-radius:6px;padding:8px 8px 10px;min-width:0}
.phase-title{font-weight:600;font-size:12px;padding:2px 4px 8px}
.phase-title .num{margin-right:6px}
.nodes{display:grid;gap:24px}
.node{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;position:relative;z-index:1;color:var(--ink)}
.node small{display:flex;justify-content:space-between;font-size:10px;color:var(--faint)}
.node b{display:block;font-weight:550;font-size:13px;line-height:1.45;margin-top:2px}
.node[aria-pressed=true]{border-color:var(--purple)}
@media(max-width:760px){.graph{--cols:2 !important}}
@media(max-width:360px){.graph{--cols:1 !important}}
.node-panel{margin-top:6px}
.node-panel[hidden]{display:none}
.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.detail-head h3{font-size:15px;font-weight:550;line-height:1.6;color:var(--ink-2)}
.detail-nav{display:flex;gap:6px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.detail-grid section{background:var(--bg-subtle);border-radius:6px;padding:10px 12px}
.detail-grid h4{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:4px}
.phase-card{margin-top:12px}
.phase-card .kv{margin-top:8px}
.verified{font-size:11px}
.node-list details{border-top:1px solid var(--line);padding:8px 0}
.node-list summary{cursor:pointer}
.ready .node-list{display:none}
.budget{height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden;margin:10px 0 6px}
.budget i{position:absolute;inset:0 auto 0 0;width:var(--w,0%);background:var(--green);border-radius:99px}
/* 方案 */
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.route span{background:var(--bg-subtle);border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.condition{padding:18px 0;border-top:1px solid var(--line)}
.condition:first-of-type{border-top:0}
.condition h3{font-size:15px;font-weight:550;line-height:1.6;color:var(--ink-2);margin-bottom:6px}
.condition .now{font-size:14px}
.condition .impact{color:var(--muted);font-size:13px;line-height:1.8;margin-top:4px}
.decide{margin-top:10px;background:var(--pending-bg);border-radius:6px;padding:10px 12px;font-size:13px}
.decide b{display:block;font-size:11px;color:var(--pending);font-weight:400}
.decide.settled{background:var(--green-pale)}
.decide.settled b{color:var(--green)}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.jump a{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:3px 8px;color:var(--ink-2)}
.feature{margin-top:24px}
.feature-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.feature-head h3{font-size:15px;font-weight:550;line-height:1.6;color:var(--ink-2)}
.feature-head p{color:var(--muted);font-size:13px;line-height:1.8;margin-top:2px}
.feature-head button{white-space:nowrap;flex:none}
.demo-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:12px 0 6px}
.demo{border:1px solid var(--line);border-radius:7px;overflow:auto;background:var(--bg)}
.demo-stage{width:1100px;transform-origin:0 0}
.app-shell{display:grid;grid-template-columns:200px 1fr;width:100%;min-height:560px;background:var(--bg);font-size:12px;color:var(--ink)}
.demo.narrow .app-shell{grid-template-columns:1fr;min-height:0}
.demo.narrow .app-side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
.demo.narrow .app-logo{margin:0 10px 0 0}
.demo.narrow .app-body{padding:18px}
.app-side{background:var(--bg-subtle);border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:6px}
.app-logo{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:18px}
.app-logo b{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--purple);color:var(--bg);font-size:12px}
.app-side a{display:block;color:var(--ink);padding:7px 10px;border-radius:5px;font-size:12px}
.app-side a.current{background:var(--line);font-weight:600}
.app-work{min-width:0;display:flex;flex-direction:column}
.app-top{display:flex;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--bg-subtle)}
.app-body{padding:24px;position:relative}
.app-body h3{font-size:19px;font-weight:600;margin-bottom:4px}
.app-body h4{font-size:12px;font-weight:600;margin-bottom:6px}
.app-body input,.app-body select,.app-body textarea{font:inherit;font-size:12px;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:9px 10px;background:var(--bg);width:100%}
.app-body textarea{min-height:72px}
.app-body label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.app-body button{font-size:11px;padding:7px 11px}
.app-body .primary,.primary{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.app-body .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app-body .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.app-body .block{border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:12px}
.app-body .hint{font-size:11px;color:var(--muted);margin-top:6px}
.app-body th{font-size:11px;padding:12px 6px}
.app-body td{font-size:12px;color:var(--muted);padding:12px 9px}
.app-body .pill{display:inline-block;font-size:11px;color:var(--muted);padding:3px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.app-body .pill.ok{background:var(--green-pale);color:var(--green);border-color:var(--pass-line)}
.app-body .pill.warn{background:var(--pending-bg);color:var(--pending);border-color:var(--blocked)}
.app-body .result{margin-top:10px;font-size:12px;color:var(--green)}
.app-body .result:empty{display:none}
.app-body .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.app-body .stat{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin-right:8px}
.app-body .stat b{display:block;font-size:19px;font-weight:600}
.app-body .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.app-body .lane{background:var(--bg-subtle);border-radius:6px;padding:10px;min-height:120px}
.app-body .lane .card-mini,.app-body .card-mini{font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:12px;margin-top:8px}
.app-body .notice{border:1px solid var(--line);background:var(--pending-bg);border-radius:6px;padding:10px 12px;font-size:12px;margin:10px 0}
[data-pin]{position:relative}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1px solid var(--pin);color:var(--pin);background:var(--bg);font-size:10px;font-weight:400;padding:0;margin-right:6px;vertical-align:middle;line-height:1}
button.pin{cursor:pointer}
.notes{margin-top:14px;display:grid;gap:0}
.note{padding:14px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.note strong{display:block;margin-bottom:4px;color:var(--ink);font-weight:600}
.note p+p{margin-top:4px}
.note.highlight{background:var(--pending-bg);margin:0 -10px;padding:14px 10px;border-radius:6px}
.context{border:1px solid var(--line);background:var(--pending-bg);border-radius:6px;font-size:12px;margin-top:10px}
.context.info{background:var(--bg-subtle)}
.context summary{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.context .context-body{padding:0 12px 10px}
.demo-error{color:var(--red);font-size:11px;margin-top:6px}
/* 制作进度 */
.summary-card{border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:12px;background:var(--bg-subtle)}
.summary-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--orange)}
.state-done .state-dot{background:var(--green)}
.state-blocked .state-dot{background:var(--red)}
.summary-card h2{font-size:19px;font-weight:600;margin-top:10px}
.summary-card .bigline{margin-top:12px;font-size:13px;color:var(--muted)}
.summary-card .bigline b{font-size:24px;font-weight:600;color:var(--ink);margin-right:4px}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,0%);background:var(--green);border-radius:99px}
.next{display:grid;grid-template-columns:56px 1fr;gap:10px;border-top:1px solid var(--line);margin-top:18px;padding-top:12px;font-size:13px}
.timeline{position:relative}
.event{display:grid;grid-template-columns:52px 22px 1fr;gap:6px;padding-bottom:14px}
.event time{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:12px;text-align:right}
.event .track{position:relative;display:flex;justify-content:center}
.event .track:after{content:"";position:absolute;top:30px;bottom:-14px;width:1px;background:var(--line)}
.event:last-child .track:after{display:none}
.event .mark{margin-top:10px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:10px;color:var(--green);position:relative;z-index:1}
.event.doing .mark{color:var(--orange);border-color:var(--orange)}
.event.todo .mark{color:var(--faint)}
.event.blocked .mark{color:var(--red);border-color:var(--red)}
.event .body{border:1px solid var(--line);border-radius:9px;padding:12px 15px;background:var(--bg);box-shadow:var(--shadow);transition:border-color .2s}
.event .body h3{font-size:14px;font-weight:550;display:flex;justify-content:space-between;gap:8px}
.event .body p{color:var(--muted);font-size:13px;line-height:1.8;margin-top:4px}
.event.focus .body{border-color:var(--purple)}
.substep{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:6px 0;border-top:1px dashed var(--line)}
.event details{margin-top:8px;font-size:11px}
.event summary{cursor:pointer;color:var(--muted)}
.cells .ok{color:var(--green)}
.cells .doing{color:var(--orange)}
.cells .no{color:var(--faint)}
/* 验收报告 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat-card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg)}
.stat-card strong{display:block;font-size:24px;line-height:1.3;font-weight:600;color:var(--ink)}
.stat-card p{font-size:11px;color:var(--muted)}
.stat-card.pass strong{color:var(--green)}.stat-card.fail strong{color:var(--red)}.stat-card.judge strong{color:var(--purple)}.stat-card.untested strong{color:var(--orange)}
.checks{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}
@media(max-width:760px){.checks{grid-template-columns:1fr}}
.path-list{display:grid;gap:8px;align-content:start}
.path-list button{text-align:left;border-radius:8px;padding:10px 12px;color:var(--ink);box-shadow:var(--shadow-path)}
.path-list button small{display:block;font-size:10px}
.path-list button[aria-pressed=true]{border-color:var(--purple)}
.path-flow+.path-flow{margin-top:24px}
.ready .path-flow{display:none}
.ready .path-flow.active{display:block}
.path-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pnode{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border-radius:8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:var(--shadow-path)}
.pnode.pass{border-color:var(--pass-line)}.pnode.fail{border-color:var(--fail)}.pnode.blocked{border-color:var(--blocked);background:var(--pending-bg)}.pnode.unknown{border-style:dashed;border-color:var(--unknown)}
.pnode .st{font-size:10px;white-space:nowrap}
.pnode.pass .st{color:var(--pass-text)}.pnode.fail .st{color:var(--red)}.pnode.blocked .st{color:var(--orange)}.pnode.unknown .st{color:var(--faint)}
.pnode.playing{border-color:var(--purple)}
.plink{font-size:11px;color:var(--pass-text);padding:6px 0 6px 18px;border-left:2px solid var(--pass-line);margin-left:16px}
.plink.fail{color:var(--red);border-color:var(--fail)}.plink.blocked{color:var(--orange);border-color:var(--blocked)}.plink.unknown{color:var(--muted);border-left-style:dashed;border-color:var(--unknown)}
.evidence-box{margin-top:12px;background:var(--bg-subtle);border:1px solid var(--line);border-radius:8px;padding:18px 15px;font-size:13px}

<script>
(function(){
'use strict';
var doc=document;
function $(s,r){return (r||doc).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||doc).querySelectorAll(s))}
/* 每个区块单独初始化：成功才加 ready 切到交互版式；出错保持无脚本版式，只在这一块显示说明，其他区块照常 */
function guard(el,name,fn){if(!el)return;try{fn();el.classList.add('ready')}catch(e){el.classList.remove('ready');$$('#node-panel,#phase-panel',el).forEach(function(x){x.hidden=true});var p=doc.createElement('p');p.className='block-error';p.textContent=name+'的交互没能加载，下面按静态方式显示。（'+e.message+'）';el.insertBefore(p,el.firstChild)}}
var timers=[];function stopAll(){timers.forEach(clearTimeout);timers=[];$$('.focus,.playing').forEach(function(x){x.classList.remove('focus','playing')});$$('[data-stop]').forEach(function(b){b.hidden=true});$$('[data-play]').forEach(function(b){b.disabled=false})}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function replay(items,cls,onStep,btn){stopAll();if(btn){btn.disabled=true;var s=$('[data-stop="'+btn.getAttribute('data-play')+'"]');if(s)s.hidden=false}
 items.forEach(function(el,i){timers.push(setTimeout(function(){items.forEach(function(x){x.classList.remove(cls)});el.classList.add(cls);el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});if(onStep)onStep(el,i)},i*900))});
 timers.push(setTimeout(stopAll,items.length*900+500))}
$$('[data-stop]').forEach(function(b){b.hidden=true;b.addEventListener('click',stopAll)});
doc.addEventListener('visibilitychange',function(){if(doc.hidden)stopAll()});

/* 需求说明：流程图连线、节点详情 */
var graph=$('.graph');
if(graph)guard(graph.closest('.section'),'流程图',function(){
 var nodes=$$('.node',graph),panel=$('#node-panel'),current=0;
 function edgesSpec(){try{return JSON.parse($('#graph-edges').textContent)}catch(e){return []}}
 var spec=edgesSpec();
 function draw(){var svg=$('svg.edges',graph);if(!svg)return;var g=graph.getBoundingClientRect();if(!g.width)return;var out='';
  spec.forEach(function(e){var a=$('.node[data-node="'+e.from+'"]',graph),b=$('.node[data-node="'+e.to+'"]',graph);if(!a||!b)return;
   var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
   var ax=ra.left-g.left,ay=ra.top-g.top,bx=rb.left-g.left,by=rb.top-g.top,d;
   if(e.loop){var gy=g.height-8,gx=Math.max(2,bx-10);d='M'+(ax+ra.width/2)+' '+(ay+ra.height)+' V'+gy+' H'+gx+' V'+(by+rb.height/2)+' H'+bx;
    out+='<path class="loop" data-a="'+e.from+'" data-b="'+e.to+'" d="'+d+'" marker-end="url(#arrow)"/>';
    if(e.label)out+='<text x="'+(gx+6)+'" y="'+(gy-4)+'">'+e.label.replace(/[<&]/g,'')+'</text>';return}
   else if(bx>=ax+ra.width-2){var mx=ax+ra.width+(bx-ax-ra.width)/2;d='M'+(ax+ra.width)+' '+(ay+ra.height/2)+' H'+mx+' V'+(by+rb.height/2)+' H'+bx;}
   else if(by>=ay+ra.height){var my=ay+ra.height+(by-ay-ra.height)/2;d='M'+(ax+ra.width/2)+' '+(ay+ra.height)+' V'+my+' H'+(bx+rb.width/2)+' V'+by;}
   else{var x2=Math.min(ax,bx)-8;d='M'+ax+' '+(ay+ra.height/2)+' H'+x2+' V'+(by+rb.height/2)+' H'+bx;}
   out+='<path class="'+(e.loop?'loop':'')+'" data-a="'+e.from+'" data-b="'+e.to+'" d="'+d+'" marker-end="url(#arrow)"/>';
   if(e.label){var tx=e.loop?Math.min(ax,bx)+4:(ax+bx)/2+6,ty=e.loop?(ay+by)/2+rb.height/2:(ay+by)/2+ra.height/2-6;out+='<text x="'+tx+'" y="'+ty+'">'+e.label.replace(/[<&]/g,'')+'</text>'}});
  svg.setAttribute('width',g.width);svg.setAttribute('height',g.height);
  svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#d8d0c4" stroke-width="1.5"/></marker></defs>'+out;mark()}
 function mark(){$$('svg.edges path[data-a]',graph).forEach(function(p){var on=p.getAttribute('data-a')==current||p.getAttribute('data-b')==current;p.classList.toggle('on',on)})}
 function select(i){current=i;nodes.forEach(function(n){n.setAttribute('aria-pressed',String(+n.getAttribute('data-node')===i))});
  var src=$('.node-list [data-detail="'+i+'"] .detail-src');if(panel&&src){panel.hidden=false;$('.panel-body',panel).innerHTML=src.innerHTML;$('.panel-title',panel).textContent=$('.node[data-node="'+i+'"] b').textContent;$('.panel-sub',panel).textContent=src.getAttribute('data-sub')||''}
  var ph=$('.node[data-node="'+i+'"]').getAttribute('data-phase');$$('.phase-tabs button').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-phase')===ph))});
  var pc=$('#phase-panel');var psrc=$('.phase-src[data-phase="'+ph+'"]');if(pc&&psrc){pc.innerHTML=psrc.innerHTML;pc.hidden=false}
  mark()}
 nodes.forEach(function(n){n.addEventListener('click',function(){select(+n.getAttribute('data-node'))})});
 $$('.phase-tabs button').forEach(function(b){b.addEventListener('click',function(){var f=$('.node[data-phase="'+b.getAttribute('data-phase')+'"]',graph);if(f){select(+f.getAttribute('data-node'));f.scrollIntoView({block:'nearest'})}})});
 var prev=$('#node-prev'),next=$('#node-next');
 if(prev)prev.addEventListener('click',function(){select((current-1+nodes.length)%nodes.length)});
 if(next)next.addEventListener('click',function(){select((current+1)%nodes.length)});
 if(window.ResizeObserver)new ResizeObserver(function(){requestAnimationFrame(draw)}).observe(graph);else window.addEventListener('resize',draw);
 draw();select(0);
});

/* 方案：Demo 缩放、重置、编号说明 */
var demos=window.__studioDemos||{};
$$('.demo').forEach(function(box){guard(box.closest('.feature'),'这个示例',function(){
 var i=box.getAttribute('data-demo'),body=$('.app-body',box),original=body?body.innerHTML:'';
 function run(){if(!body)return;var err=$('.demo-error',box.parentNode);if(err)err.remove();
  if(typeof demos[i]==='function'){try{demos[i](body)}catch(e){var p=doc.createElement('p');p.className='demo-error';p.textContent='这个示例的操作出错了：'+e.message;box.parentNode.insertBefore(p,box.nextSibling)}}
  $$('.pin',body).forEach(upgradePin)}
 function upgradePin(pin){if(pin.tagName==='BUTTON')return;var b=doc.createElement('button');b.type='button';b.className='pin';b.textContent=pin.textContent;b.setAttribute('aria-label','看说明 '+pin.textContent);pin.replaceWith(b)}
 box.addEventListener('click',function(e){var a=e.target.closest('a');if(a){e.preventDefault();var g=a.getAttribute('data-goto');if(g){var t=doc.getElementById('feature-'+g);if(t)t.scrollIntoView({block:'start'})}}
  var pin=e.target.closest('.pin');if(pin){var sec=box.closest('.feature');$$('.note',sec).forEach(function(n){n.classList.toggle('highlight',n.getAttribute('data-note')===pin.textContent.trim())});var n=$('.note[data-note="'+pin.textContent.trim()+'"]',sec);if(n)n.scrollIntoView({block:'nearest'})}});
 box.addEventListener('submit',function(e){e.preventDefault()},true);
 var reset=$('[data-reset="'+i+'"]');if(reset)reset.addEventListener('click',function(){body.innerHTML=original;$$('.note.highlight',box.closest('.feature')).forEach(function(n){n.classList.remove('highlight')});run()});
 var stage=$('.demo-stage',box);
 function fit(){if(!stage)return;var w=box.clientWidth;if(!w)return;var narrow=w<700,base=narrow?640:1100;box.classList.toggle('narrow',narrow);stage.style.width=base+'px';var z=Math.min(1,w/base);stage.style.zoom=z;box.style.overflowX=z<1?'hidden':'auto'}
 if(window.ResizeObserver)new ResizeObserver(fit).observe(box);fit();run();
})});

/* 制作进度：回放 */
var pp=$('[data-play="progress"]');
if(pp)guard(pp.closest('.section'),'时间轴回放',function(){pp.addEventListener('click',function(){replay($$('.timeline .event:not(.todo)'),'focus',null,pp)})});

/* 验收报告：路径、节点证据、回放 */
var plist=$$('.path-list button');
if(plist.length)guard(plist[0].closest('.section'),'业务路径',function(){
 function show(i){stopAll();plist.forEach(function(b){b.setAttribute('aria-pressed',String(+b.getAttribute('data-path')===i))});$$('.path-flow').forEach(function(f){f.classList.toggle('active',+f.getAttribute('data-path')===i)});var f=$('.path-flow.active');var box=$('.evidence-box',f);if(box)box.innerHTML=$('.path-detail-src',f).innerHTML}
 function ev(node){var f=node.closest('.path-flow'),box=$('.evidence-box',f),src=$('.node-ev',node);if(box&&src)box.innerHTML=src.innerHTML}
 plist.forEach(function(b){b.addEventListener('click',function(){show(+b.getAttribute('data-path'))})});
 $$('.pnode').forEach(function(n){n.addEventListener('click',function(){ev(n)})});
 var vp=$('[data-play="paths"]');if(vp)vp.addEventListener('click',function(){var f=$('.path-flow.active');if(f)replay($$('.pnode',f),'playing',ev,vp)});
 show(0);
});
})();
