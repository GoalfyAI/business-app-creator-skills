# template=true
# GoalfyMax scene-creator Skill 持续校验流水线。
# 发版由本地 scripts/release-skill.sh 完成，推送后 GitHub Actions 负责登记与发布 Release；
# 本流水线只做校验，不改动仓库任何内容。
sources:
  repo_0:
    type: codeup
    name: scene-creator-skills
    endpoint: https://codeup.aliyun.com/goalfyai/goalfyagent/scene-creator-skills.git
    branch: main
    triggerEvents:
      - push
    branchesFilter: ^main$
    cloneDepth: 1
    certificate:
      type: serviceConnection
      serviceConnection: f6zd5dyxonnftkc5

defaultWorkspace: repo_0

concurrencyConfig:
  maxRunningPipelineInstances: 100
  pipelineMaxRunningBehavior: rejectNew
  maxRunningJobInstances: 1

stages:
  stage_validate:
    name: QA校验
    jobs:
      job_validate:
        name: 校验当前版本与全量测试
        runsOn:
          group: private/o3yZdT0POoGmFbak
          labels: linux,amd64
          vm: true
        driven: auto
        steps:
          step_checkout:
            name: 检出并锁定提交
            step: Command
            with:
              run: |
                set -euo pipefail
                cd ${PROJECT_DIR}
                git fetch origin ${CI_COMMIT_REF_NAME}:refs/remotes/origin/${CI_COMMIT_REF_NAME} --depth=1 --force
                git checkout -B ${CI_COMMIT_REF_NAME} origin/${CI_COMMIT_REF_NAME}
                RELEASE_SHA=$(git rev-parse HEAD)
                echo "RELEASE_SHA=${RELEASE_SHA}" >> $FLOW_ENV
          step_test:
            name: 安装依赖并测试
            step: Command
            with:
              run: |
                set -euo pipefail
                cd ${PROJECT_DIR}
                # 构建镜像的系统 Python 受 PEP 668 保护，pip 装不进去（--user 同样被拦）。
                # 用官方安装脚本装独立二进制，不碰系统 Python。已装则跳过。
                if ! command -v uv >/dev/null 2>&1; then
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                fi
                export PATH="$HOME/.local/bin:$PATH"
                uv sync --group dev
                uv run ruff check scripts tests
                uv run pytest -q
                # check 覆盖：发布清单、四平台 Skill 副本一致性、压缩包时效、安装文档必备事实
                uv run python scripts/build_platform_packages.py check
                # 校验流水线不得改动仓库任何内容
                if [ -n "$(git status --porcelain)" ]; then
                  echo "校验过程改动了仓库文件：" >&2
                  git status --short >&2
                  exit 1
                fi
