# template=true
# GoalfyMax scene-creator Skill 独立流水线（T-2775）。
# QA/main push 只校验、不更新版本；只有手工进入 PROD job 才更新仓库版本并登记 CN Max Hub。
sources:
  repo_0:
    type: codeup
    name: scene-creator-skills
    endpoint: https://codeup.aliyun.com/goalfyai/goalfyagent/scene-creator-skills.git
    branch: main
    triggerEvents:
      - push
    branchesFilter: ^main$
    cloneDepth: 1
    certificate:
      type: serviceConnection
      serviceConnection: f6zd5dyxonnftkc5

defaultWorkspace: repo_0

concurrencyConfig:
  maxRunningPipelineInstances: 100
  pipelineMaxRunningBehavior: rejectNew
  maxRunningJobInstances: 1

stages:
  stage_validate:
    name: QA校验
    jobs:
      job_validate:
        name: 校验当前版本与全量测试
        runsOn:
          group: private/o3yZdT0POoGmFbak
          labels: linux,amd64
          vm: true
        driven: auto
        steps:
          step_checkout:
            name: 检出并锁定提交
            step: Command
            with:
              run: |
                set -euo pipefail
                cd ${PROJECT_DIR}
                git fetch origin ${CI_COMMIT_REF_NAME}:refs/remotes/origin/${CI_COMMIT_REF_NAME} --depth=1 --force
                git checkout -B ${CI_COMMIT_REF_NAME} origin/${CI_COMMIT_REF_NAME}
                RELEASE_SHA=$(git rev-parse HEAD)
                echo "RELEASE_SHA=${RELEASE_SHA}" >> $FLOW_ENV
          step_test:
            name: 安装依赖并测试
            step: Command
            with:
              run: |
                set -euo pipefail
                cd ${PROJECT_DIR}
                python3 -m pip install --user uv
                python3 -m uv sync --group dev
                python3 -m uv run ruff check scene-creator/release/build_platform_packages.py scripts/prod-release-skill.py tests
                python3 -m uv run pytest -q
                python3 -m uv run python scene-creator/release/build_platform_packages.py check
                if DEPLOY_ENV=qa scripts/prod-release-skill.py --prepare-only; then
                  echo "非 PROD 环境错误地更新了版本" >&2
                  exit 1
                fi

  stage_prod:
    name: PROD发布
    needs:
      - stage_validate
    jobs:
      job_prod:
        name: 更新仓库版本并登记CN Max Hub
        driven: manual
        runsOn:
          group: private/o3yZdT0POoGmFbak
          labels: linux,amd64
          vm: true
        steps:
          step_release:
            name: 仅在main更新PROD版本
            step: Command
            with:
              run: |
                set -euo pipefail
                cd ${PROJECT_DIR}
                test "${CI_COMMIT_REF_NAME}" = "main"
                RELEASE_SHA=$(git rev-parse HEAD)
                python3 -m pip install --user uv
                python3 -m uv sync --group dev
                git fetch origin main --depth=1 --force
                test "$(git rev-parse origin/main)" = "${RELEASE_SHA}"
                output=$(DEPLOY_ENV=prod SCENE_SKILL_RELEASE_NOTES="${CI_COMMIT_TITLE}" \
                  python3 -m uv run python scripts/prod-release-skill.py --prepare-only)
                version=$(printf '%s\n' "${output}" | sed -n 's/^SCENE_SKILL_VERSION=//p')
                test -n "${version}"
                echo "SCENE_SKILL_VERSION=${version}" >> $FLOW_ENV
                echo "SCENE_SKILL_RELEASE_NOTES=${CI_COMMIT_TITLE}" >> $FLOW_ENV
                python3 -m uv run python scene-creator/release/build_platform_packages.py check
                DEPLOY_ENV=prod python3 -m uv run python scripts/prod-release-skill.py --verify-runtime-only
                python3 -m uv run pytest -q
                git config user.name "goalfymax-release-bot"
                git config user.email "goalfymax-release-bot@goalfy.ai"
                git add README.md scene-creator codex claude-code .agents .claude-plugin pyproject.toml uv.lock
                git commit -m "chore(skill): release ${version} [skip ci]"
                git tag -a "skill/${version}" -m "${CI_COMMIT_TITLE}"
                git push origin HEAD:main
                git push origin "skill/${version}"
          step_register:
            name: 仓库版本推送成功后登记CN Max Hub
            step: Command
            with:
              run: |
                set -euo pipefail
                cd ${PROJECT_DIR}
                DEPLOY_ENV=prod SCENE_SKILL_VERSION=${SCENE_SKILL_VERSION} \
                  SCENE_SKILL_RELEASE_NOTES="${SCENE_SKILL_RELEASE_NOTES}" \
                  python3 -m uv run python scripts/prod-release-skill.py --register-only
