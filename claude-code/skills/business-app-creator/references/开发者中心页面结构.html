<!--
  开发者中心页面结构体（模板）。正本路径：goalfy-app-workbench 目录下 docs/workbench.html，一个应用一份。
  页面只回答两件事：业务过程——这个应用替谁、按什么过程把事做成；开发内容——我们正在把它做成什么。
  规则：
  1. 骨架不可改：<header>、两个 <section> 与其中带 data-block 的块，id 与顺序固定，只填内容，不加不删不改名。
  2. 每个块的 data-updated-stage / data-updated-at 记录最近一次由哪个阶段、什么时间更新；没内容时保留 <p class="empty">尚未产出</p>。
  3. 只写业务语言：禁止资产数字 ID、节点标识、工具名、字段名、代码。技术信息、验证证据、工单记录都留在 md 里给 Agent。
  4. 待开发者拍板的事项写在对应块里，用 <span class="tag yellow">待定</span> 标出；决定后改成结论。
  5. 图用内联 SVG，不依赖外部脚本；Mermaid 源码可作注释附在 SVG 后。不引外部样式与脚本；图片用 docs/screens/ 相对路径。
  6. 每次只改受影响的块，整份文件原子写入；工作台监听文件自动刷新。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{应用名}} · 开发者中心</title>
<style>
  :root { --ink:#1f2a37; --muted:#5b6b7b; --line:#dfe5ec; --bg:#fbfcfd; --card:#ffffff; --accent:#0f6e56; --warn:#b26b00; --bad:#b3261e; --ok:#1b7f4b; }
  html { color-scheme: light; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.65 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:var(--card); display:flex; flex-wrap:wrap; gap:16px 32px; align-items:baseline; }
  header h1 { font-size:20px; margin:0; }
  header .meta { color:var(--muted); font-size:13px; }
  main { max-width:1080px; margin:0 auto; padding:16px 28px 64px; }
  section.part { margin:28px 0; }
  section.part > h2 { font-size:18px; margin:0 0 4px; }
  section.part > p.lead { color:var(--muted); margin:0 0 12px; }
  .block { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin:12px 0; }
  .block > h3 { font-size:15px; margin:0 0 8px; }
  .block p.empty { color:var(--muted); margin:0; }
  table { border-collapse:collapse; width:100%; font-size:14px; margin:8px 0; }
  th, td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
  th { background:#f3f6f9; font-weight:600; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .tag.green { background:#e3f4ea; color:var(--ok); } .tag.yellow { background:#fff3dc; color:var(--warn); } .tag.red { background:#fbe6e4; color:var(--bad); }
  figure { margin:8px 0; overflow-x:auto; } figure svg { max-width:100%; height:auto; }
  .src { color:var(--muted); font-size:12px; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8edf2; --muted:#9aa8b6; --line:#2b3642; --bg:#0f1519; --card:#161d24; } th { background:#1c2630; } .tag.green{background:#12352a} .tag.yellow{background:#3a2c0f} .tag.red{background:#3b1a17} }
</style>
</head>
<body>
<header>
  <h1>{{应用名}}</h1>
  <span class="meta">当前阶段 {{G?}} · 版本 {{revision}} · 更新于 {{时间}}</span>
</header>
<main>

<section class="part" id="business">
  <h2>业务过程</h2>
  <p class="lead">这个应用替谁、按什么过程把事做成。</p>
  <div class="block" data-block="biz-who" data-updated-stage="" data-updated-at=""><h3>给谁做、为什么值得做</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="biz-promise" data-updated-stage="" data-updated-at=""><h3>承诺到哪里、什么算合格</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="biz-journey" data-updated-stage="" data-updated-at=""><h3>用户怎么走完这件事</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="biz-decisions" data-updated-stage="" data-updated-at=""><h3>过程里的关键判断，谁来定</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="biz-redline" data-updated-stage="" data-updated-at=""><h3>什么绝对不做</h3><p class="empty">尚未产出</p></div>
</section>

<section class="part" id="build">
  <h2>开发内容</h2>
  <p class="lead">我们正在把它做成什么。</p>
  <div class="block" data-block="build-shape" data-updated-stage="" data-updated-at=""><h3>做成什么、由什么组成</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="build-lanes" data-updated-stage="" data-updated-at=""><h3>每一步由谁执行：规则、模型、确认、人</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="build-route" data-updated-stage="" data-updated-at=""><h3>运行路线与每个节点</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="build-data" data-updated-stage="" data-updated-at=""><h3>业务数据表</h3><p class="empty">尚未产出</p></div>
  <div class="block" data-block="build-pages" data-updated-stage="" data-updated-at=""><h3>页面与原型</h3><p class="empty">尚未产出</p></div>
</section>

</main>
</body>
</html>
