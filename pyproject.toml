[project]
name = "scene-creator-skills"
version = "0.1.0"
description = "Goalfy 场景包制作 Skill 与发布工具的唯一源码"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
