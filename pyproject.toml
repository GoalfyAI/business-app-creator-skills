[project]
name = "scene-creator-skills"
version = "1.19.8"
description = "GoalfyMax 场景包制作 Skill、Codex/Claude Code 插件模板与可复现发布工具"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
