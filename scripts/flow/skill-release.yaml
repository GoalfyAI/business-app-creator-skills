# 云效 Flow 发版流水线模板：Skill 的 main 走 OA 发车，结构与其他服务一致（部署pre → PRE审批 → 部署prod）。
#   准备发版：main 最新提交已有 skill/<版本> tag 就沿用，否则自动发版并推回 Codeup main；发布提交写进 USER_COMMIT
#   部署pre：PRE 部署这个提交（推 GitHub business-pre、登记 PRE Hub、设两线），回调 OA 生成待审批的发版审查
#   PRE审批：人工卡点，由 OA 发车放行
#   部署prod：同一提交推 GitHub main、登记 prod Hub、设两线，回调 OA 立即核验生产并对账
# 只运行 main；其他分支在 QA / PRE 环境流水线（skill-env-deploy.yaml）里测。
#
# 新建流水线时需要：
# 1. 代码源：本仓库，分支 main；不开启代码提交触发（发版由人手动运行，或按需改为合入 main 触发）。
# 2. 关联通用变量组：共用组（CODEUP_PUSH_URL、GITHUB_PUSH_URL、HUB_OPERATOR_*）与 prod 组
#    （SKILL_REGISTRY_SECRET、HUB_API_KEY 为 prod 值，另加 SKILL_REGISTRY_SECRET_PRE、HUB_API_KEY_PRE 为 PRE 值）。
# 3. OA 规范服务 scene-creator-skills 登记为独立发布服务，pipeline_id 填这条流水线。
sources:
  repo_0:
    type: codeup
    name: scene-creator-skills
    endpoint: https://codeup.aliyun.com/goalfyai/goalfyagent/scene-creator-skills.git
    branch: main
    certificate:
      type: serviceConnection
      serviceConnection: <Codeup 服务连接>
defaultWorkspace: repo_0
concurrencyConfig:
  maxRunningPipelineInstances: 1
  pipelineMaxRunningBehavior: queue
stages:
  stage_prepare:
    name: 准备发版
    jobs:
      job_prepare:
        name: 发版并锁定提交
        # 香港构建机：北京公共构建机访问 GitHub 常断（Empty reply from server）
        runsOn:
          group: public/cn-hongkong
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          setup_python:
            step: SetupPython
            with:
              pythonVersion: '3.12'
          release:
            step: Command
            with:
              run: |
                set -euo pipefail
                set +x
                cd "${PROJECT_DIR}"
                # SetupPython 把解释器装在仓库目录的 Python/ 下，不忽略会让发版脚本判定工作区不干净
                echo "/Python/" >> .git/info/exclude
                python3 -m pip install --quiet pyyaml
                python3 scripts/deploy_env.py --release-only --branch "${CI_COMMIT_REF_NAME}"
          set_vars:
            name: 提升变量
            step: BatchSetVariables
            with:
              variables:
                - key: USER_COMMIT
                  value: ${USER_COMMIT}
                - key: SKILL_VERSION
                  value: ${SKILL_VERSION}
  stage_deploy_pre:
    name: 部署pre
    needs:
      - stage_prepare
    jobs:
      job_deploy_cn_pre:
        name: 部署到cn-pre
        runsOn:
          group: public/cn-hongkong
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          setup_python:
            step: SetupPython
            with:
              pythonVersion: '3.12'
          deploy:
            step: Command
            with:
              run: |
                set -euo pipefail
                set +x
                cd "${PROJECT_DIR}"
                echo "/Python/" >> .git/info/exclude
                python3 -m pip install --quiet pyyaml
                # 同一条流水线里 PRE 与 prod 密钥同名，PRE 用带 _PRE 后缀的那份
                SKILL_REGISTRY_SECRET="${SKILL_REGISTRY_SECRET_PRE:?缺少 SKILL_REGISTRY_SECRET_PRE}" \
                HUB_API_KEY="${HUB_API_KEY_PRE:?缺少 HUB_API_KEY_PRE}" \
                  python3 scripts/deploy_env.py --env pre --branch "${CI_COMMIT_REF_NAME}" --build-number "${BUILD_NUMBER}"
          notify_oa:
            name: 通知OA生成发版审查
            step: Command
            with:
              run: |
                set -euo pipefail
                # OA 反查云效运行真实性与分支，不需要令牌；HeadCommit 取本次运行的 USER_COMMIT
                curl -sS --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 30 -X POST \
                  -H 'Content-Type: application/json' \
                  -d "{\"pipeline_id\":\"${PIPELINE_ID}\",\"run_id\":${BUILD_NUMBER},\"stage\":\"pre\"}" \
                  https://oa.goalfyai.cn/internal/v1/deploy-reviews/flow-webhook
  stage_approve_pre:
    name: PRE审批
    needs:
      - stage_deploy_pre
    jobs:
      job_approve:
        name: 确认PRE正常
        component: ManualValidate
        with:
          validateMethod: or
          validatorType: users
          validators:
            - '1425764554136938'
            - '202932466130960822'
            - '208203266454893839'
  stage_deploy_prod:
    name: 部署prod
    needs:
      - stage_approve_pre
    jobs:
      job_deploy_cn:
        name: 部署到cn-prod
        runsOn:
          group: public/cn-hongkong
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          setup_python:
            step: SetupPython
            with:
              pythonVersion: '3.12'
          deploy:
            step: Command
            with:
              run: |
                set -euo pipefail
                set +x
                cd "${PROJECT_DIR}"
                echo "/Python/" >> .git/info/exclude
                python3 -m pip install --quiet pyyaml
                python3 scripts/deploy_env.py --env prod --branch "${CI_COMMIT_REF_NAME}" --build-number "${BUILD_NUMBER}"
          notify_oa:
            name: 通知OA核验生产
            step: Command
            with:
              run: |
                set -euo pipefail
                curl -sS --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 30 -X POST \
                  -H 'Content-Type: application/json' \
                  -d "{\"pipeline_id\":\"${PIPELINE_ID}\",\"run_id\":${BUILD_NUMBER},\"stage\":\"prod\"}" \
                  https://oa.goalfyai.cn/internal/v1/deploy-reviews/flow-webhook
